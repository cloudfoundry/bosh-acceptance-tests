name: Run BATs Specs
on: [push, pull_request]

jobs:
  bats_specs:
    strategy:
      matrix:
        ruby: ['3.3', '3.4', '4.0', head]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: bundle install
      - run: bundle exec rspec spec/bat
